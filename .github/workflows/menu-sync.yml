# Menüyü her gece nurpastanesi.com'dan çeker; değişiklik varsa commit'ler.
# Commit main'e düşünce "Yayınla" iş akışı siteyi otomatik günceller.
name: Menüyü güncelle
on:
  schedule:
    - cron: "17 3 * * *"   # her gün 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/update_menu.py
      - name: Değişiklik varsa commit'le
        run: |
          git add -A assets/menu assets/menu-data.js
          if git diff --cached --quiet; then echo "Menü değişmedi."; exit 0; fi
          git config user.name "menu-sync"
          git config user.email "menu-sync@users.noreply.github.com"
          git commit -m "Menü güncellendi ($(date -u +%Y-%m-%d))"
          git push
